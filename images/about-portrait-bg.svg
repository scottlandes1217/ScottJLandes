<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Dark background -->
    <radialGradient id="bgGrad" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>

    <!-- Warm geometric gradient -->
    <linearGradient id="amberWarm" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <!-- Concentric circle pattern gradient -->
    <radialGradient id="concentricGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Diagonal pattern gradient -->
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Small diamond pattern -->
    <pattern id="diamonds" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="17" y="17" width="6" height="6" rx="1" fill="#f59e0b" opacity="0.06" transform="rotate(45 20 20)"/>
    </pattern>

    <!-- Hex pattern -->
    <pattern id="hexGrid" width="52" height="90" patternUnits="userSpaceOnUse">
      <polygon points="26,2 48,14 48,38 26,50 4,38 4,14" fill="none" stroke="#f59e0b" stroke-width="0.4" opacity="0.05"/>
    </pattern>

    <!-- Blur filters -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="mediumBlur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <filter id="fineBlur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

    <!-- Subtle noise -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.025"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Large warm glow centered lower -->
  <ellipse cx="400" cy="450" rx="350" ry="300" fill="url(#concentricGlow)" filter="url(#mediumBlur)"/>

  <!-- Concentric rings suggesting craft/precision -->
  <g opacity="0.1">
    <circle cx="400" cy="420" r="60" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
    <circle cx="400" cy="420" r="85" fill="none" stroke="#f59e0b" stroke-width="0.4"/>
    <circle cx="400" cy="420" r="110" fill="none" stroke="#d97706" stroke-width="0.3"/>
    <circle cx="400" cy="420" r="140" fill="none" stroke="#f59e0b" stroke-width="0.3"/>
    <circle cx="400" cy="420" r="170" fill="none" stroke="#fbbf24" stroke-width="0.2"/>
  </g>

  <!-- Diamond pattern overlay -->
  <rect width="800" height="800" fill="url(#diamonds)" opacity="0.7"/>

  <!-- Diagonal golden lines suggesting structure and craft -->
  <g opacity="0.06">
    <line x1="0" y1="200" x2="800" y2="600" stroke="#f59e0b" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="700" stroke="#f59e0b" stroke-width="0.4"/>
    <line x1="0" y1="100" x2="800" y2="500" stroke="#d97706" stroke-width="0.3"/>
    <line x1="200" y1="0" x2="600" y2="800" stroke="#f59e0b" stroke-width="0.3"/>
    <line x1="300" y1="0" x2="700" y2="800" stroke="#d97706" stroke-width="0.2"/>
  </g>

  <!-- Geometric accent cluster - top left -->
  <g opacity="0.12">
    <rect x="60" y="80" width="4" height="35" rx="2" fill="#fbbf24"/>
    <rect x="72" y="90" width="4" height="20" rx="2" fill="#f59e0b"/>
    <circle cx="55" cy="130" r="8" fill="none" stroke="#fbbf24" stroke-width="0.6"/>
  </g>

  <!-- Geometric accent cluster - bottom right -->
  <g opacity="0.1">
    <rect x="700" y="650" width="3" height="40" rx="1.5" fill="#f59e0b"/>
    <rect x="712" y="660" width="3" height="25" rx="1.5" fill="#d97706"/>
    <circle cx="720" cy="705" r="6" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
  </g>

  <!-- Central craft/compass motif -->
  <g opacity="0.08">
    <!-- Cross-hair lines -->
    <line x1="400" y1="250" x2="400" y2="380" stroke="#fbbf24" stroke-width="0.4"/>
    <line x1="400" y1="460" x2="400" y2="590" stroke="#fbbf24" stroke-width="0.4"/>
    <line x1="230" y1="420" x2="370" y2="420" stroke="#fbbf24" stroke-width="0.4"/>
    <line x1="430" y1="420" x2="570" y2="420" stroke="#fbbf24" stroke-width="0.4"/>

    <!-- Small filled diamond at center -->
    <rect x="396" y="416" width="8" height="8" rx="1" fill="#f59e0b" opacity="0.5" transform="rotate(45 400 420)"/>
  </g>

  <!-- Warm edge glow top -->
  <rect x="0" y="0" width="800" height="200" fill="url(#amberWarm)" opacity="0.5"/>

  <!-- Fine dots scattered for visual interest -->
  <g opacity="0.08">
    <circle cx="150" cy="300" r="1.5" fill="#fbbf24"/>
    <circle cx="250" cy="180" r="1" fill="#f59e0b"/>
    <circle cx="650" cy="250" r="1.5" fill="#fbbf24"/>
    <circle cx="700" cy="350" r="1" fill="#f59e0b"/>
    <circle cx="200" cy="600" r="1.2" fill="#d97706"/>
    <circle cx="600" cy="680" r="1.3" fill="#f59e0b"/>
    <circle cx="450" cy="720" r="1" fill="#fbbf24"/>
    <circle cx="350" cy="120" r="0.8" fill="#d97706"/>
    <circle cx="550" cy="150" r="0.9" fill="#f59e0b"/>
  </g>

  <!-- Noise overlay -->
  <rect width="800" height="800" filter="url(#noise)" opacity="0.3"/>
</svg>
