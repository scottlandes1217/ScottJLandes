<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f1629"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>

    <!-- Amber light streaks -->
    <linearGradient id="amberStreak1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="amberStreak2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="amberStreak3" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Teal accent -->
    <linearGradient id="tealStreak" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>

    <!-- Purple accent -->
    <linearGradient id="purpleStreak" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm glow -->
    <radialGradient id="amberGlow" cx="40%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tealGlow" cx="75%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft blur for organic shapes -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="mediumBlur">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
    </filter>

    <!-- Grid pattern for geometric accent -->
    <pattern id="dotGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#f59e0b" opacity="0.08"/>
    </pattern>

    <!-- Diagonal line accent -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="20%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip for clean edges -->
    <clipPath id="edgeClip">
      <rect x="-20" y="-20" width="1960" height="1120"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <g clip-path="url(#edgeClip)">

    <!-- Organic flowing shapes - large soft blobs -->
    <ellipse cx="700" cy="500" rx="600" ry="450" fill="url(#amberGlow)" filter="url(#mediumBlur)"/>
    <ellipse cx="1400" cy="350" rx="500" ry="500" fill="url(#tealGlow)" filter="url(#mediumBlur)"/>

    <!-- Main diagonal light streaks -->
    <polygon points="-100,800 200,-200 350,-200 50,800" fill="url(#amberStreak1)" opacity="0.7"/>
    <polygon points="400,1100 600,-200 750,-200 550,1100" fill="url(#amberStreak3)" opacity="0.5"/>
    <polygon points="1200,1200 1400,-200 1480,-200 1280,1200" fill="url(#amberStreak2)" opacity="0.4"/>

    <!-- Teal accent streaks -->
    <polygon points="1300,1200 1500,-200 1560,-200 1360,1200" fill="url(#tealStreak)" opacity="0.5"/>

    <!-- Purple accent streaks -->
    <polygon points="900,1200 1100,-200 1140,-200 940,1200" fill="url(#purpleStreak)" opacity="0.6"/>

    <!-- Secondary diagonal accents - thinner -->
    <line x1="350" y1="-200" x2="180" y2="1200" stroke="url(#lineGrad)" stroke-width="1" opacity="0.3"/>
    <line x1="1600" y1="-200" x2="1450" y2="1200" stroke="url(#lineGrad)" stroke-width="0.8" opacity="0.2"/>
    <line x1="1750" y1="-200" x2="1650" y2="1200" stroke="url(#tealStreak)" stroke-width="0.6" opacity="0.3"/>

    <!-- Geometric dots grid overlay in lower-left -->
    <rect x="0" y="600" width="800" height="480" fill="url(#dotGrid)" opacity="0.5"/>

    <!-- Geometric accent marks - small rectangles and lines suggesting structure -->
    <rect x="200" y="200" width="3" height="60" rx="1.5" fill="#f59e0b" opacity="0.15"/>
    <rect x="200" y="270" width="8" height="8" rx="2" fill="#f59e0b" opacity="0.2"/>

    <rect x="300" y="150" width="40" height="2" rx="1" fill="#f59e0b" opacity="0.12"/>
    <rect x="300" y="160" width="25" height="2" rx="1" fill="#f59e0b" opacity="0.15"/>

    <circle cx="1500" cy="700" r="3" fill="#0891b2" opacity="0.15"/>
    <circle cx="1515" cy="715" r="2" fill="#0891b2" opacity="0.1"/>
    <circle cx="1485" cy="685" r="2.5" fill="#0891b2" opacity="0.12"/>

    <!-- Warm accent ring -->
    <ellipse cx="1000" cy="550" rx="350" ry="300" fill="none" stroke="#d97706" stroke-width="0.5" opacity="0.08"/>
    <ellipse cx="1000" cy="550" rx="380" ry="330" fill="none" stroke="#f59e0b" stroke-width="0.3" opacity="0.05"/>

    <!-- Small bright accent dots -->
    <circle cx="520" cy="400" r="4" fill="#fbbf24" opacity="0.25"/>
    <circle cx="518" cy="398" r="12" fill="#f59e0b" opacity="0.06"/>

    <circle cx="1420" cy="600" r="3" fill="#06b6d4" opacity="0.2"/>
    <circle cx="1418" cy="598" r="10" fill="#0891b2" opacity="0.05"/>

    <!-- Horizontal light band -->
    <rect x="0" y="750" width="1920" height="1" fill="url(#lineGrad)" opacity="0.15"/>

    <!-- Edge glow on right side -->
    <ellipse cx="1800" cy="600" rx="300" ry="400" fill="url(#tealGlow)" filter="url(#mediumBlur)"/>

    <!-- Bottom warm reflection -->
    <rect x="0" y="950" width="1920" height="130" fill="url(#amberGlow)" opacity="0.08"/>

    <!-- Fine crosshatch accent in corner -->
    <g opacity="0.06">
      <line x1="1700" y1="0" x2="1920" y2="220" stroke="#7c3aed" stroke-width="0.5"/>
      <line x1="1750" y1="0" x2="1920" y2="270" stroke="#7c3aed" stroke-width="0.5"/>
      <line x1="1650" y1="0" x2="1920" y2="170" stroke="#7c3aed" stroke-width="0.5"/>
    </g>

  </g>

  <!-- Noise overlay -->
  <rect width="1920" height="1080" filter="url(#noise)" opacity="0.4"/>
</svg>
